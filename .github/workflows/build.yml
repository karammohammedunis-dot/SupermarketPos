name: Build Windows EXE
on: workflow_dispatch: push: branches: - main
jobs: build: runs-on: windows-latest
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '8.0.x'

  - name: Restore dependencies
    run: dotnet restore src/SupermarketPos.Wpf/SupermarketPos.Wpf.csproj

  - name: Publish Windows EXE
    run: dotnet publish src/SupermarketPos.Wpf/SupermarketPos.Wpf.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

  - name: Upload application
    uses: actions/upload-artifact@v4
    with:
      name: SupermarketPOS-Windows
      path: publish/
